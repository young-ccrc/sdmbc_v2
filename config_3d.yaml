
# ================= Bias Correction Configuration =================
# This configuration file is used for setting up the bias correction script.
# It contains paths, simulation settings, bias correction parameters, and options.

# Please note that this is a general guide. For more specific instructions, you should refer to the documentation provided by the developers or contact them directly.

# ================= Input Paths =================
# Paths to input data and output directories
bc_hist_path: "/g/data/fs38/publications/CMIP6/CMIP/CSIRO/ACCESS-ESM1-5/historical/r6i1p1f1/6hrLev" # path to the data for historical bias correction
bc_future_path: "/g/data/fs38/publications/CMIP6/ScenarioMIP/CSIRO/ACCESS-ESM1-5/ssp370/r6i1p1f1/6hrLev" # path to the data for future bias correction
obs_path: "/g/data/w28/yk8692/input/era5/access_esm" # observation data path
out_path: "/g/data/w28/yk8692/tests/access/calibration" # path to save the output

# ================= Simulation Periods =================
# Historical simulation settings
bc_hist: True # Enable historical simulation (True: Yes, False: No)
startyear_h: 1959 # Start year for historical simulation
endyear_h: 1989 # End year for historical simulation

# Future simulation settings
bc_future: True # Enable future simulation (True: Yes, False: No)
startyear_f: 1990 # Start year for future simulation
endyear_f: 2020 # End year for future simulation

# ================= GCM (Global Climate Model) Information =================
# Historical data settings
infor: "6hrLev" # Data frequency (6hrLev: 3D data, Oday: 2D data)
gname: "ACCESS-ESM1-5" # Model name
period: "historical" # Simulation period (historical, validation, or future)
cinfor: "r6i1p1f1" # Configuration information
sinfor: "gn" # Spatial resolution
version: "20200529" # Dataset version

# Future data settings
scenario: "ssp370" # Climate scenario for future simulation (e.g., ssp126, ssp370)
cinfor_f: "r6i1p1f1" # Configuration for future simulation
version_f: "20211213" # Dataset version for future simulation
period_f: "validation" # Simulation period for future data (historical, validation, or future)

# ================= Bias Correction Settings =================
bc_boundary: "lateral" # Boundary type (surface: 2D, lateral: 3D)
input_model: "reanalysis" # "reanalysis" for ERA5, "model" for CMIP6
target_variable: ["hus", "ta", "ua", "va"] # ["tos"] for 2D, ["hus", "ta", "ua", "va"] for 3D
slevel: 0 # Start level for bias correction, start from 0
elevel: 38 # End level for bias correction, 0 for surface variable, e.g., tos
no_of_variables: 3 # Number of variables to be bias corrected, generally 3, 1 for 2D
no_of_iterations: 1 # Number of iterations for bias correction, default: 1
correction_model: 4 # Correction method (1: mean, 2: mean and variance, 3: nested, 4: multivariate (default for 3D) : 1-3 should be used for 2D)
sub_daily_correction: True # Enable sub-daily bias correction (True: Yes, False: No)

# ================= Spatial Selection =================
# Latitude and longitude range for the selected area
lat_min: 10 # Minimum latitude
lat_max: 15 # Maximum latitude
lon_min: 110 # Minimum longitude
lon_max: 115 # Maximum longitude

# ================= Physical Limits =================
# Upper and lower physical limits for variables (wind speed (m/s), temperature (K), specific humidity (g/kg), sea surface temperature (K))
upper_limit: [190, 330, 100, 330] # Upper limits for variables
lower_limit: [0.001, 137, 0.001, 270] # Lower limits for variables
max_tile_size: 500 # Maximum grid cells within each tile for bias correction depending on the memory of the machine

# ================= Options =================
save_bc_output: True # Save the bias-corrected output (True: Yes, False: Save factors only)
cleanup_bc_inputs: True # Remove bias-corrected intermediate files after reformatting

# Input file information for reformatting
archive_roots: ["/g/data/oi10/replicas/CMIP6", "/g/data/fs38/publications/CMIP6"]
var_to_table: {"hus":"6hrLev", "ta":"6hrLev", "ua":"6hrLev", "va":"6hrLev", "tos":"Oday", "ps":"Amon"}
# =============== Input for bias correction ended =========================
