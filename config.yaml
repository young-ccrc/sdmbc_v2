# ================= Bias Correction Configuration =================
# This configuration file is used for setting up the bias correction script.
# It contains paths, simulation settings, bias correction parameters, and options.

# ================= Input Paths =================
# Paths to input data and output directories
bc_hist_path: "/g/data/fs38/publications/CMIP6/CMIP/CSIRO/ACCESS-ESM1-5/historical/r1i1p1f1/6hrLev" # Historical bias correction data path
bc_future_path: "/g/data/fs38/publications/CMIP6/ScenarioMIP/CSIRO/ACCESS-ESM1-5/ssp370/r6i1p1f1/6hrLev" # Future bias correction data path
obs_path: "/g/data/w28/yk8692/input/era5/" # Path to ERA5 observation data
out_path: "/g/data/w28/yk8692/sdmbc_v2/tests/calibration" # Directory to save bias-corrected output
out_figure_path: "/g/data/w28/yk8692/sdmbc_v2/tests/calibration" # Directory to save figures

# ================= Simulation Periods =================
# Historical simulation settings
bc_hist: True # Enable historical simulation (True: Yes, False: No)
startyear_h: 1959 # Start year for historical simulation
endyear_h: 1989 # End year for historical simulation

# Future simulation settings
bc_future: False # Enable future simulation (True: Yes, False: No)
startyear_f: 1990 # Start year for future simulation
endyear_f: 2020 # End year for future simulation

# ================= GCM (Global Climate Model) Information =================
# Historical data settings
infor: "6hrLev" # Data frequency (6hrLev: 3D data, Oday: 2D data)
gname: "ACCESS-ESM1-5" # Model name
period: "historical" # Simulation period (historical or future)
cinfor: "r1i1p1f1" # Configuration information
sinfor: "gn" # Spatial resolution
version: "20191115" # Dataset version

# Future data settings
scenario: "ssp126" # Climate scenario for future simulation (e.g., ssp126, ssp370)
cinfor_f: "r6i1p1f1" # Configuration for future simulation
version_f: "20211213" # Dataset version for future simulation

# ================= Bias Correction Settings =================
bc_boundary: "lateral" # Boundary type (surface: 2D, lateral: 3D)
input_model: "reanalysis" # Input model type (reanalysis: ERA5, model: CMIP6)
target_variable: ["hus", "ta", "ua", "va"] # Variables to correct (e.g., tos for 2D; hus, ta, ua, va for 3D)
slevel: 25 # Starting level for bias correction
elevel: 26 # Ending level for bias correction
no_of_variables: 3 # Number of variables for bias correction (1 for 2D, 3 for 3D)
no_of_iterations: 1 # Number of bias correction iterations
correction_model: 4 # Correction method (1: mean, 2: variance, 3: nested, 4: multivariate)
sub_daily_correction: False # Enable sub-daily bias correction (True: Yes, False: No)

# ================= Spatial Selection =================
# Latitude and longitude range for the selected area
lat_min: -90 # Minimum latitude
lat_max: 90 # Maximum latitude
lon_min: 0 # Minimum longitude
lon_max: 360 # Maximum longitude

# ================= Physical Limits =================
# Upper and lower physical limits for variables (wind speed (m/s), temperature (K), specific humidity (g/kg), sea surface temperature (K))
upper_limit: [190, 330, 100, 330] # Upper limits for variables
lower_limit: [0.001, 137, 0.001, 270] # Lower limits for variables

# ================= Options =================
save_bc_output: true # Save bias-corrected output (True: Yes, False: Save factors only)
draw_figure: False # Generate and save figures (True: Yes, False: No; note: 3D figures take more time)
reformat_to_original: False # Reformat output to original format (True: Yes, False: No)

# ================= Usage =================
# Edit the above parameters as needed. Save the file and pass its path to the script as follows:
# python sdmbc_hist_main.py --config /path/to/config.yaml
# Ensure all file paths and variable names are correct. Refer to documentation for further details.
