# Selected area ---------------------------------------------------
# latitudes and longitudes of the selected area
lat_min: 10 # -55
lat_max: 15 # -5
lon_min: 110 # 80
lon_max: 115 # 170

# Simulation periods ----------------------------------------------
startyear_h: 1984
endyear_h: 1984
# =============== Input for interpolation ended =========================
